name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Drift guard: COVERAGE.md is generated from the commander tree in
      # src/program.ts. If a command or flag lands without re-running
      # `npm run gen-coverage`, this fails with a diff so the PR author
      # re-runs it locally.
      - name: Coverage doc is up to date
        run: npm run check-coverage

  scripts:
    name: scripts (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/scripts -v
